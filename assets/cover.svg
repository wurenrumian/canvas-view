    <rect x="52" y="64" width="220" height="204" rx="40" fill="#ffffff" fill-opacity="0.95" />
    <g clip-path="url(#photo)">
      <circle cx="120" cy="134" r="25" fill="#4338ca" fill-opacity="0.45" />
      <path d="M52 268 L146 170 L202 226 L244 184 L272 212 L272 268 Z" fill="#4338ca" fill-opacity="0.45" />
