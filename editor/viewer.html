<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Canvas</title>
    <style>
      :root {
        color-scheme: light dark;
        --canvas-bg: var(--orca-background, #ffffff);
        --canvas-fg: var(--orca-foreground, #18181b);
        --canvas-border: var(--orca-border, rgba(127, 127, 127, 0.28));
        --canvas-muted: color-mix(in srgb, var(--canvas-fg) 55%, transparent);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        overflow: hidden;
        font: 12px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--canvas-fg);
        background: var(--canvas-bg);
      }
      #viewport {
        position: absolute;
        inset: 0;
        overflow: hidden;
        cursor: grab;
        touch-action: none;
        overscroll-behavior: none;
        outline: none;
        background-color: var(--canvas-bg);
        background-image:
          linear-gradient(45deg, rgba(127, 127, 127, 0.07) 25%, transparent 25%),
          linear-gradient(-45deg, rgba(127, 127, 127, 0.07) 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, rgba(127, 127, 127, 0.07) 75%),
          linear-gradient(-45deg, transparent 75%, rgba(127, 127, 127, 0.07) 75%);
        background-size: 16px 16px;
        background-position: 0 0, 0 8px, 8px -8px, -8px 0;
      }
      #viewport.dragging {
        cursor: grabbing;
      }
      #stage {
        position: absolute;
        top: 0;
        left: 0;
        transform-origin: 0 0;
        will-change: transform;
      }
      #image {
        display: block;
        max-width: none;
        max-height: none;
        user-select: none;
        -webkit-user-drag: none;
        pointer-events: none;
      }
      #toolbar {
        position: absolute;
        left: 12px;
        bottom: 12px;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 3px;
        border: 1px solid var(--canvas-border);
        border-radius: 8px;
        background: color-mix(in srgb, var(--canvas-bg) 86%, transparent);
        backdrop-filter: blur(8px);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
      }
      #toolbar button {
        appearance: none;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        font-variant-numeric: tabular-nums;
        height: 22px;
        min-width: 24px;
        padding: 0 6px;
        border-radius: 5px;
        cursor: pointer;
      }
      #toolbar button:hover {
        background: color-mix(in srgb, var(--canvas-fg) 10%, transparent);
      }
      #toolbar button:active {
        background: color-mix(in srgb, var(--canvas-fg) 16%, transparent);
      }
      #zoom {
        min-width: 46px;
      }
      #meta {
        margin: 0 6px 0 4px;
        color: var(--canvas-muted);
        white-space: nowrap;
      }
      #meta:empty {
        display: none;
      }
      #hint {
        position: absolute;
        right: 12px;
        bottom: 16px;
        z-index: 2;
        color: var(--canvas-muted);
        font-size: 11px;
        pointer-events: none;
        user-select: none;
      }
      #overlay {
        position: absolute;
        inset: 0;
        z-index: 3;
        display: none;
        place-items: center;
        padding: 24px;
        text-align: center;
        background: var(--canvas-bg);
      }
      #overlay.visible {
        display: grid;
      }
      #overlay p {
        max-width: 420px;
        margin: 0;
        color: var(--canvas-muted);
      }
      @media (max-width: 720px) {
        #hint {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="viewport" tabindex="0" role="img" aria-label="Image canvas">
      <div id="stage"><img id="image" alt="" draggable="false" /></div>
    </div>

    <div id="toolbar" role="toolbar" aria-label="Zoom controls">
      <button id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">&minus;</button>
      <button id="zoom" type="button" aria-label="Actual size" title="Actual size">100%</button>
      <button id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">+</button>
      <button id="fit" type="button" aria-label="Fit to view" title="Fit to view">Fit</button>
      <span id="meta"></span>
    </div>

    <div id="hint">Drag to pan &middot; Wheel to zoom &middot; Double-click to reset</div>
    <div id="overlay"><p id="overlay-text"></p></div>

    <script>
      ;(() => {
        const MIME = {
          png: 'image/png',
          apng: 'image/apng',
          jpg: 'image/jpeg',
          jpeg: 'image/jpeg',
          gif: 'image/gif',
          webp: 'image/webp',
          bmp: 'image/bmp',
          ico: 'image/x-icon',
          avif: 'image/avif',
          svg: 'image/svg+xml'
        }

        const MIN_SCALE = 0.02
        const MAX_SCALE = 64
        const FIT_PADDING = 24
        const KEEP_VISIBLE = 64
        const WHEEL_SPEED = 0.0028
        const WHEEL_DELTA_CAP = 240
        const ZOOM_STEP = 1.25
        const DRAG_THRESHOLD = 3

        const viewport = document.getElementById('viewport')
        const stage = document.getElementById('stage')
        const image = document.getElementById('image')
        const zoomButton = document.getElementById('zoom')
        const metaLabel = document.getElementById('meta')
        const overlay = document.getElementById('overlay')
        const overlayText = document.getElementById('overlay-text')

        const media = { width: 0, height: 0, vector: false, ready: false, fileType: '' }
        const view = { scale: 1, x: 0, y: 0, fitted: true }

        let objectUrl = null
        let drag = null
        let pinch = null
        const pointers = new Map()

        const clamp = (value, min, max) => Math.min(max, Math.max(min, value))

        function localPoint(event) {
          const rect = viewport.getBoundingClientRect()
          return { x: event.clientX - rect.left, y: event.clientY - rect.top }
        }

        function applyView() {
          stage.style.transform =
            'translate3d(' + view.x + 'px, ' + view.y + 'px, 0) scale(' + view.scale + ')'
          zoomButton.textContent = Math.round(view.scale * 100) + '%'
        }

        function fitScale() {
          if (!media.ready) return 1
          const vw = Math.max(1, viewport.clientWidth)
          const vh = Math.max(1, viewport.clientHeight)
          const fitW = Math.max(1, vw - FIT_PADDING * 2)
          const fitH = Math.max(1, vh - FIT_PADDING * 2)
          const raw = Math.min(fitW / media.width, fitH / media.height)
          return media.vector ? raw : Math.min(1, raw)
        }

        function clampView() {
          if (!media.ready) return
          const vw = viewport.clientWidth
          const vh = viewport.clientHeight
          const w = media.width * view.scale
          const h = media.height * view.scale
          const keepX = Math.min(KEEP_VISIBLE, Math.max(24, w * 0.25))
          const keepY = Math.min(KEEP_VISIBLE, Math.max(24, h * 0.25))
          view.x = clamp(view.x, keepX - w, vw - keepX)
          view.y = clamp(view.y, keepY - h, vh - keepY)
        }

        function setScaleAt(scale, anchor) {
          const next = clamp(scale, MIN_SCALE, MAX_SCALE)
          if (!media.ready) {
            view.scale = next
            applyView()
            return
          }
          const ax = anchor ? anchor.x : viewport.clientWidth / 2
          const ay = anchor ? anchor.y : viewport.clientHeight / 2
          const ratio = next / view.scale
          view.x = ax - (ax - view.x) * ratio
          view.y = ay - (ay - view.y) * ratio
          view.scale = next
          view.fitted = Math.abs(next - fitScale()) < 0.001
          clampView()
          applyView()
        }

        function fit() {
          if (!media.ready) return
          const scale = fitScale()
          view.scale = scale
          view.x = (viewport.clientWidth - media.width * scale) / 2
          view.y = (viewport.clientHeight - media.height * scale) / 2
          view.fitted = true
          clampView()
          applyView()
        }

        function panBy(dx, dy) {
          view.x += dx
          view.y += dy
          view.fitted = false
          clampView()
          applyView()
        }

        /* Wheel zooms about the pointer, with no modifier key. */
        viewport.addEventListener(
          'wheel',
          (event) => {
            if (!media.ready) return
            event.preventDefault()
            const unit =
              event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? viewport.clientHeight : 1
            const delta = clamp(event.deltaY * unit, -WHEEL_DELTA_CAP, WHEEL_DELTA_CAP)
            if (delta === 0) return
            setScaleAt(view.scale * Math.exp(-delta * WHEEL_SPEED), localPoint(event))
          },
          { passive: false }
        )

        /* Pointer drag pans; two pointers pinch. */
        viewport.addEventListener('pointerdown', (event) => {
          if (!media.ready) return
          if (event.pointerType === 'mouse' && event.button !== 0) return
          viewport.focus({ preventScroll: true })
          try {
            viewport.setPointerCapture(event.pointerId)
          } catch {
            /* synthetic or already-released pointer */
          }
          pointers.set(event.pointerId, { x: event.clientX, y: event.clientY })

          if (pointers.size === 1) {
            pinch = null
            drag = {
              x: event.clientX,
              y: event.clientY,
              startX: event.clientX,
              startY: event.clientY,
              moved: false
            }
            viewport.classList.add('dragging')
          } else if (pointers.size === 2) {
            drag = null
            pinch = pinchSnapshot()
          }
        })

        viewport.addEventListener('pointermove', (event) => {
          if (!pointers.has(event.pointerId)) return
          pointers.set(event.pointerId, { x: event.clientX, y: event.clientY })

          if (pinch && pointers.size >= 2) {
            updatePinch()
            return
          }
          if (!drag) return

          const dx = event.clientX - drag.x
          const dy = event.clientY - drag.y
          drag.x = event.clientX
          drag.y = event.clientY
          if (!drag.moved && Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY) > DRAG_THRESHOLD) {
            drag.moved = true
          }
          panBy(dx, dy)
        })

        function endPointer(event) {
          if (!pointers.delete(event.pointerId)) return
          if (pointers.size < 2) pinch = null
          if (pointers.size === 0) {
            drag = null
            viewport.classList.remove('dragging')
            return
          }
          const remaining = [...pointers.values()][0]
          drag = {
            x: remaining.x,
            y: remaining.y,
            startX: remaining.x,
            startY: remaining.y,
            moved: true
          }
        }

        viewport.addEventListener('pointerup', endPointer)
        viewport.addEventListener('pointercancel', endPointer)

        function pinchSnapshot() {
          const points = [...pointers.values()]
          if (points.length < 2) return null
          const rect = viewport.getBoundingClientRect()
          const [a, b] = points
          return {
            distance: Math.hypot(a.x - b.x, a.y - b.y),
            mid: { x: (a.x + b.x) / 2 - rect.left, y: (a.y + b.y) / 2 - rect.top }
          }
        }

        function updatePinch() {
          const next = pinchSnapshot()
          if (!next) return
          if (!pinch || pinch.distance === 0) {
            pinch = next
            return
          }
          view.x += next.mid.x - pinch.mid.x
          view.y += next.mid.y - pinch.mid.y
          view.fitted = false
          setScaleAt(view.scale * (next.distance / pinch.distance), next.mid)
          pinch = next
        }

        /* Double-click toggles between fit and 100%. */
        viewport.addEventListener('dblclick', (event) => {
          if (!media.ready) return
          event.preventDefault()
          if (Math.abs(view.scale - fitScale()) < 0.001) setScaleAt(1, localPoint(event))
          else fit()
        })

        viewport.addEventListener('dragstart', (event) => event.preventDefault())

        window.addEventListener('keydown', (event) => {
          if (!media.ready || event.defaultPrevented) return
          if (event.metaKey || event.ctrlKey || event.altKey) return
          const step = event.shiftKey ? 160 : 48
          switch (event.key) {
            case '+':
            case '=':
              event.preventDefault()
              setScaleAt(view.scale * ZOOM_STEP)
              break
            case '-':
            case '_':
              event.preventDefault()
              setScaleAt(view.scale / ZOOM_STEP)
              break
            case '0':
            case 'f':
            case 'F':
              event.preventDefault()
              fit()
              break
            case '1':
              event.preventDefault()
              setScaleAt(1)
              break
            case 'ArrowLeft':
              event.preventDefault()
              panBy(-step, 0)
              break
            case 'ArrowRight':
              event.preventDefault()
              panBy(step, 0)
              break
            case 'ArrowUp':
              event.preventDefault()
              panBy(0, -step)
              break
            case 'ArrowDown':
              event.preventDefault()
              panBy(0, step)
              break
            default:
              break
          }
        })

        document.getElementById('zoom-in').addEventListener('click', () => setScaleAt(view.scale * ZOOM_STEP))
        document.getElementById('zoom-out').addEventListener('click', () => setScaleAt(view.scale / ZOOM_STEP))
        document.getElementById('zoom').addEventListener('click', () => setScaleAt(1))
        document.getElementById('fit').addEventListener('click', () => fit())

        if (typeof ResizeObserver !== 'undefined') {
          new ResizeObserver(() => {
            if (!media.ready) return
            if (view.fitted) fit()
            else {
              clampView()
              applyView()
            }
          }).observe(viewport)
        }

        function mimeFor(fileType) {
          return MIME[String(fileType || '').toLowerCase()] || ''
        }

        function showMessage(text) {
          overlayText.textContent = text
          overlay.classList.add('visible')
        }

        function hideMessage() {
          overlay.classList.remove('visible')
        }

        function renderDocument(doc) {
          if (!doc || !doc.content) return
          const payload = doc.content
          const fileType = String(doc.fileType || '').toLowerCase()
          let blob = null

          if (payload.kind === 'bytes' && payload.bytes) {
            blob = new Blob([payload.bytes], { type: mimeFor(fileType) || 'application/octet-stream' })
          } else if (payload.kind === 'text' && typeof payload.text === 'string') {
            const isSvg = mimeFor(fileType) === 'image/svg+xml' || /<svg[\s>]/i.test(payload.text)
            blob = new Blob([payload.text], { type: isSvg ? 'image/svg+xml' : 'text/plain' })
          }

          if (!blob) {
            showMessage('This document could not be read.')
            return
          }

          const nextUrl = URL.createObjectURL(blob)
          const previousUrl = objectUrl
          objectUrl = nextUrl
          media.ready = false

          image.onload = () => {
            media.width = image.naturalWidth || 512
            media.height = image.naturalHeight || 512
            media.vector = blob.type === 'image/svg+xml'
            media.fileType = fileType
            media.ready = true
            image.style.width = media.width + 'px'
            image.style.height = media.height + 'px'
            metaLabel.textContent =
              (fileType ? fileType.toUpperCase() : 'IMAGE') +
              ' \u00b7 ' +
              Math.round(media.width) +
              ' \u00d7 ' +
              Math.round(media.height)
            hideMessage()
            fit()
          }

          image.onerror = () => {
            media.ready = false
            image.removeAttribute('src')
            showMessage('This file could not be displayed as an image.')
          }

          image.src = nextUrl
          if (previousUrl) URL.revokeObjectURL(previousUrl)
        }

        function start() {
          if (!window.orca || !window.orca.document) {
            showMessage('This viewer must run inside Orca.')
            return
          }
          try {
            window.orca.document.onDidChange((doc) => {
              try {
                renderDocument(doc)
              } catch (error) {
                showMessage((error && error.message) || String(error))
              }
            })
          } catch (error) {
            showMessage((error && error.message) || String(error))
          }
        }

        start()
      })()
    </script>
  </body>
</html>
